name: CI

on:
  # Branches are checked by their pull request; a push run as well would only be cancelled.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the run still going.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Fast gate (~2 min, no native code needed): formatting and analyzers.
  quality:
    name: format + analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Verify formatting (dotnet format)
        run: dotnet format UpSTEPer.slnx --verify-no-changes

      - name: Build with all analyzers (warnings are errors)
        run: dotnet build UpSTEPer.slnx -c Release

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.preset == 'win-x64' && 'windows-2022' || matrix.preset == 'linux-x64' && 'ubuntu-24.04' || 'macos-15' }}
    # Only a cold cache builds OCCT from source (~20-60 min); otherwise a run takes minutes.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # All platforms on every run: Actions minutes are free for public repositories.
        preset: [win-x64, linux-x64, osx-arm64]

    env:
      # Our pinned vcpkg checkout. VCPKG_ROOT itself is exported in the setup step, because
      # msvc-dev-cmd and the runner images point VCPKG_ROOT at a preinstalled vcpkg.
      UPS_VCPKG_DIR: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      UPS_REQUIRE_NATIVE: "1"
      # Coverage is collected on one platform only (all tests incl. native run there).
      UPS_COVERAGE: ${{ matrix.preset == 'linux-x64' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ---- Native library: rebuilt only when something under native/ changes ----------------

      - name: Restore native build
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: artifacts/native/${{ matrix.preset }}
          key: native-${{ matrix.preset }}-${{ hashFiles('native/**') }}

      - name: Install build tools (Linux)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf autoconf-archive automake libtool bison \
            libgl1-mesa-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev

      - name: Install build tools (macOS)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool

      - name: Set up MSVC environment (Windows)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg (pinned to the manifest baseline)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          baseline=$(grep -oE '"builtin-baseline": *"[0-9a-f]+"' native/vcpkg.json | grep -oE '[0-9a-f]{40}')
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$UPS_VCPKG_DIR"
          git -C "$UPS_VCPKG_DIR" checkout "$baseline"
          if [ "$RUNNER_OS" = "Windows" ]; then "$UPS_VCPKG_DIR/bootstrap-vcpkg.bat" -disableMetrics; else "$UPS_VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics; fi
          mkdir -p "${{ github.workspace }}/vcpkg-cache"
          echo "VCPKG_ROOT=$UPS_VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Configure native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: native
        run: cmake --preset ${{ matrix.preset }}

      # Saved right after dependencies are built, so a later failure does not lose the OCCT build.
      - name: Save vcpkg binary cache
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build and install native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: native
        run: |
          cmake --build --preset ${{ matrix.preset }}
          cmake --install build/${{ matrix.preset }}

      - name: Save native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: artifacts/native/${{ matrix.preset }}
          # Reuse the key computed before the build; hashing native/** now would include native/build.
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      # ---- .NET ---------------------------------------------------------------------------

      # msvc-dev-cmd exports Platform=x64; MSBuild would then look for a "Release|x64" solution
      # configuration (we only have Any CPU). An empty value makes MSBuild use its default.
      - name: Reset MSBuild platform (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "Platform=" >> "$GITHUB_ENV"

      - name: Build .NET
        run: dotnet build UpSTEPer.slnx -c Release -p:UpsNativeRid=${{ matrix.preset }}

      - name: Test
        if: env.UPS_COVERAGE != '1'
        run: dotnet test --solution UpSTEPer.slnx -c Release --no-build

      - name: Test with coverage
        if: env.UPS_COVERAGE == '1'
        run: >-
          dotnet test --solution UpSTEPer.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/artifacts/coverage

      # Same script and thresholds as scripts/check.ps1; fails below the minimum.
      - name: Coverage report and minimum
        if: env.UPS_COVERAGE == '1'
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/coverage-report.ps1 -GitHubSummary

      - name: Upload coverage report
        if: always() && env.UPS_COVERAGE == '1'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage
          if-no-files-found: error

      - name: CLI smoke test
        shell: bash
        run: |
          dotnet run --project src/UpSTEPer.Cli -c Release --no-build -- runtime
          dotnet run --project src/UpSTEPer.Cli -c Release --no-build -- info "examples/ESKV 12 RAL 7035 10066410.stp"
          dotnet run --project src/UpSTEPer.Cli -c Release --no-build -- export-dxf "examples/ESKV 12 RAL 7035 10066410.stp" artifacts/example.dxf
          test -s artifacts/example.dxf

      # Renders the example in the real app and saves the first frame. Covers the GPU code that
      # unit tests cannot (MeshRenderer, ModelView) on every platform's GL flavour: ANGLE/GLES on
      # Windows, Mesa (software, under Xvfb) on Linux, Apple OpenGL on macOS.
      # macOS is not blocking yet: on the hosted runner Avalonia reports "Compositor backend doesn't
      # support GPU interop" (deferred, see docs/roadmap.md "macOS support"). A failure there emits a warning instead.
      - name: Viewer screenshot smoke test
        id: screenshot
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          mkdir -p artifacts/screenshots
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libice6 libsm6 libfontconfig1
            run() { xvfb-run -a -s "-screen 0 1600x1000x24" dotnet run "$@"; }
          else
            run() { dotnet run "$@"; }
          fi
          app=(--project src/UpSTEPer.App -c Release --no-build -- "examples/ESKV 12 RAL 7035 10066410.stp")
          # Plain view, then with face 80 (visible in the start view) highlighted.
          run "${app[@]}" --screenshot "artifacts/screenshots/viewer-${{ matrix.preset }}.png"
          run "${app[@]}" --screenshot "artifacts/screenshots/viewer-${{ matrix.preset }}-selected.png" --select-face 80
          test -s "artifacts/screenshots/viewer-${{ matrix.preset }}.png"
          test -s "artifacts/screenshots/viewer-${{ matrix.preset }}-selected.png"
          # The highlight must change the image.
          ! cmp -s "artifacts/screenshots/viewer-${{ matrix.preset }}.png" "artifacts/screenshots/viewer-${{ matrix.preset }}-selected.png"

      - name: Report unverified macOS rendering
        if: steps.screenshot.outcome == 'failure' && runner.os == 'macOS'
        run: echo "::warning title=macOS 3D view unverified::Viewer screenshot failed on macOS (deferred, docs/roadmap.md "macOS support")."

      - name: Upload viewer screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.preset }}
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Upload native binaries
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.preset }}
          path: artifacts/native/${{ matrix.preset }}
          if-no-files-found: error
