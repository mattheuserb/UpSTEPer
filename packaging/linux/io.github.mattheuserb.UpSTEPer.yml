# Flatpak of the prebuilt, self-contained Linux distribution (scripts/publish.ps1 -Rid linux-x64).
# Built by scripts/build-flatpak.sh; design: docs/packaging.md. Not a Flathub source build.
id: io.github.mattheuserb.UpSTEPer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: UpSTEPer.Desktop
finish-args:
  # Avalonia draws through X11 (XWayland on Wayland desktops) with OpenGL.
  - --share=ipc
  - --socket=x11
  - --device=dri
  # STEP files live anywhere in the home folder, and the app writes files next to them
  # (save as, DXF export, files from other programs); the portal alone is not enough for that.
  - --filesystem=home
modules:
  - name: upsteper
    buildsystem: simple
    sources:
      - type: dir
        path: ../../artifacts/publish/linux-x64
        dest: dist
      - type: file
        path: io.github.mattheuserb.UpSTEPer.desktop
      - type: file
        path: io.github.mattheuserb.UpSTEPer.metainfo.xml
      - type: file
        path: ../../src/UpSTEPer.App/Assets/upsteper.png
      - type: file
        path: ../../src/UpSTEPer.App/Assets/upsteper.svg
    build-commands:
      - mkdir -p /app/lib/upsteper /app/bin
      - cp -a dist/. /app/lib/upsteper/
      # .NET finds its files next to the real executable, so symbolic links in /app/bin work.
      - ln -s /app/lib/upsteper/UpSTEPer.Desktop /app/bin/UpSTEPer.Desktop
      - ln -s /app/lib/upsteper/upsteper /app/bin/upsteper
      - install -Dm644 io.github.mattheuserb.UpSTEPer.desktop /app/share/applications/io.github.mattheuserb.UpSTEPer.desktop
      - install -Dm644 io.github.mattheuserb.UpSTEPer.metainfo.xml /app/share/metainfo/io.github.mattheuserb.UpSTEPer.metainfo.xml
      - install -Dm644 upsteper.png /app/share/icons/hicolor/256x256/apps/io.github.mattheuserb.UpSTEPer.png
      - install -Dm644 upsteper.svg /app/share/icons/hicolor/scalable/apps/io.github.mattheuserb.UpSTEPer.svg
